# Version-Timestamp: 2026-11-26 11:08:42 AST
_subdirectory: skeleton
name:
  type: str
profile:
  type: str
  choices: [business, software]
objective:
  type: str
audience:
  type: str
constraints:
  type: json
success_criteria:
  type: json
# Optional development defaults for the software profile: agent reference
# pages, an optional code map and a short CLAUDE.md that imports AGENTS.md.
# Set false in the brief to skip them. Ignored for the business profile.
dev_defaults:
  type: bool
  default: true
dev_setup:
  type: bool
  default: "{{ profile == 'software' and dev_defaults }}"
  when: false
version_timestamp:
  type: str
