<svg xmlns="http://www.w3.org/2000/svg" width="520" height="633" viewBox="0 0 520 633" role="img" aria-labelledby="title desc"><title id="title">Create a Codex project, then a task</title><desc id="desc">Local folder → Codex project → task inside it → invoke project-starter. A task is a conversation, not another repository.</desc><!-- Version-Timestamp: 2026-09-08T22:41:42.223378-04:00 --><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#182626}.label{font-size:18px;font-weight:700;letter-spacing:1.4px;fill:#215b48}.title{font-size:25px;font-weight:700}.body{font-size:19px;fill:#52615e}.small{font-size:18px;fill:#52615e}</style><rect width="520" height="633" rx="18" fill="#f5f5ef"/><text x="28" y="35" class="label">01 / YOUR STARTING POINT</text><text x="28" y="75" class="title">Project first. Task second.</text><rect x="28" y="102" width="464" height="104" rx="12" fill="#fffefa" stroke="#cdd5cc"/><text x="46" y="130" class="body">1 / Your local project folder</text><text x="46" y="168" class="small">Files, approved context and repository</text><path d="M260 210 v20 m-6 -6 6 6 6 -6" fill="none" stroke="#215b48" stroke-width="2"/><rect x="28" y="235" width="464" height="104" rx="12" fill="#e3eee4" stroke="#cdd5cc"/><text x="46" y="263" class="body">2 / A project in Codex</text><text x="46" y="301" class="small">Select the folder for this initiative.</text><path d="M260 343 v20 m-6 -6 6 6 6 -6" fill="none" stroke="#215b48" stroke-width="2"/><rect x="28" y="368" width="464" height="104" rx="12" fill="#fffefa" stroke="#cdd5cc"/><text x="46" y="396" class="body">3 / A task inside that project</text><text x="46" y="434" class="small">Start a conversation to do the work.</text><path d="M260 476 v20 m-6 -6 6 6 6 -6" fill="none" stroke="#215b48" stroke-width="2"/><rect x="28" y="501" width="464" height="104" rx="12" fill="#e3eee4" stroke="#cdd5cc"/><text x="46" y="529" class="body">4 / Invoke project-starter</text><text x="46" y="567" class="small">Choose new, adopt existing or resume.</text></svg>