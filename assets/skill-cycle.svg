<svg xmlns="http://www.w3.org/2000/svg" width="520" height="635" viewBox="0 0 520 635" role="img" aria-labelledby="title desc"><title id="title">The four project workflow skills</title><desc id="desc">project-starter prepares the project; starter-resume restores saved state; starter-checkpoint records a handoff; starter-review proposes evidence-backed improvements.</desc><!-- Version-Timestamp: 2026-09-08T22:41:42.223378-04:00 --><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#182626}.label{font-size:18px;font-weight:700;letter-spacing:1.4px;fill:#215b48}.title{font-size:25px;font-weight:700}.body{font-size:19px;fill:#52615e}.small{font-size:18px;fill:#52615e}</style><rect width="520" height="635" rx="18" fill="#f5f5ef"/><text x="28" y="35" class="label">03 / YOUR WORKING RHYTHM</text><text x="28" y="75" class="title">Four skills. One project history.</text><rect x="28" y="102" width="464" height="96" rx="12" fill="#e3eee4" stroke="#cdd5cc"/><text x="46" y="138" class="title">project-starter</text><text x="46" y="171" class="small">Understand and prepare the project.</text><rect x="28" y="220" width="464" height="96" rx="12" fill="#fffefa" stroke="#cdd5cc"/><text x="46" y="256" class="title">starter-resume</text><text x="46" y="289" class="small">Recover saved state before work.</text><rect x="28" y="338" width="464" height="96" rx="12" fill="#fffefa" stroke="#cdd5cc"/><text x="46" y="374" class="title">starter-checkpoint</text><text x="46" y="407" class="small">Save a handoff at a milestone.</text><rect x="28" y="456" width="464" height="96" rx="12" fill="#fffefa" stroke="#cdd5cc"/><text x="46" y="492" class="title">starter-review</text><text x="46" y="525" class="small">Review lessons and propose improvements.</text><text x="28" y="606" class="small">Checkpoint deliberately. Back up separately.</text></svg>