<svg xmlns="http://www.w3.org/2000/svg" width="520" height="600" viewBox="0 0 520 600" role="img" aria-labelledby="title desc"><title id="title">Sources stay in Drive; approved memory travels in Git</title><desc id="desc">Review and approve summaries before storing them in the project repository. Push commits for backup. A clone does not restore private source access.</desc><!-- Version-Timestamp: 2026-09-08T22:41:42.223378-04:00 --><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#182626}.label{font-size:18px;font-weight:700;letter-spacing:1.4px;fill:#215b48}.title{font-size:25px;font-weight:700}.body{font-size:19px;fill:#52615e}.small{font-size:18px;fill:#52615e}</style><rect width="520" height="600" rx="18" fill="#f5f5ef"/><text x="28" y="35" class="label">02 / WHERE THINGS LIVE</text><text x="28" y="75" class="title">Originals and portable memory</text><rect x="28" y="105" width="464" height="131" rx="12" fill="#fffefa" stroke="#cdd5cc"/><text x="46" y="138" class="label">GOOGLE DRIVE / SOURCE PROVIDER</text><text x="46" y="175" class="body">Transcripts, briefs and original files</text><text x="46" y="207" class="small">Access stays with the source provider.</text><path d="M260 243 v20 m-6 -6 6 6 6 -6" fill="none" stroke="#215b48" stroke-width="2"/><text x="78" y="292" class="body">Review, summarize and approve</text><path d="M260 305 v20 m-6 -6 6 6 6 -6" fill="none" stroke="#215b48" stroke-width="2"/><rect x="28" y="343" width="464" height="145" rx="12" fill="#e3eee4" stroke="#cdd5cc"/><text x="46" y="376" class="label">PROJECT REPOSITORY</text><text x="46" y="413" class="body">Approved context, decisions and code</text><text x="46" y="445" class="small">Checkpoints + helpers + next action</text><text x="28" y="534" class="body">Commit + push → clone + resume</text><text x="28" y="568" class="small">A clone does not restore private Drive access.</text></svg>